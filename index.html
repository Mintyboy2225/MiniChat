<!DOCTYPE html>
<html>
<head>
  <title>Mini Chat</title>
  <style>
    /* Animated gradient background */
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f0f0f0, #dcd4f7, #e8e0ff);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      display: flex;
      justify-content: center;
      margin-top: 40px;
      transition: background 0.3s;
    }

    @keyframes gradientBG {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    /* Dark mode */
    body.dark {
      background: linear-gradient(135deg, #2c2c2c, #4b2c7e, #3c2c55);
      color: #eee;
    }

    body.dark #chat {
      background: #3c2c55;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    body.dark .message.me {
      background: #7c3aed;
      color: #fff;
    }

    body.dark .message.other {
      background: #5a3b9a;
      color: #eee;
    }

    body.dark #chatHeader {
      background: #4b2c7e;
      color: #eee;
    }

    body.dark #typingIndicator {
      color: #ccc;
    }

    /* Room selection */
    #roomSelection {
      display: flex;
      flex-direction: column;
      width: 400px;
      gap: 8px;
    }

    input, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #7c3aed;
    }

    button {
      cursor: pointer;
      background: #7c3aed;
      color: white;
      transition: 0.2s;
      border: none;
    }

    button:hover {
      background: #a855f7;
    }

    /* Chat container */
    #chat {
      width: 400px;
      display: none;
      border-radius: 20px;
      background: #f8f8f8;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      flex-direction: column;
    }

    #chatHeader {
      text-align: center;
      font-weight: bold;
      font-size: 16px;
      padding: 12px 0;
      border-bottom: 1px solid #ccc;
      border-radius: 20px 20px 0 0;
      background: #e5e4f7;
      color: #111;
    }

    #messages {
      height: 350px;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .message {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 15px;
      display: flex;
      flex-direction: column;
      word-wrap: break-word;
      font-size: 14px;
      animation: fadeIn 0.2s ease;
    }

    .me {
      align-self: flex-end;
      background: #7c3aed;
      color: white;
      text-align: right;
      border-radius: 15px 15px 0 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .other {
      align-self: flex-start;
      background: #d9d5f6;
      color: #111;
      text-align: left;
      border-radius: 15px 15px 15px 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .message .text {
      word-wrap: break-word;
    }

    .message .time {
      font-size: 10px;
      color: #fff;
      margin-top: 2px;
    }

    #typingIndicator {
      font-size: 12px;
      font-style: italic;
      color: #444;
      margin: 4px 12px;
      min-height: 16px;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(5px);}
      to {opacity: 1; transform: translateY(0);}
    }

    #darkModeBtn {
      margin-top: 5px;
    }

  </style>
</head>
<body>

<div id="roomSelection">
  <input id="roomCodeInput" placeholder="Enter Room Code">
  <button onclick="joinRoom()">Join Room</button>
  <input id="newRoomCode" placeholder="Or create a new Room Code">
  <button onclick="createRoom()">Create Room</button>
</div>

<div id="chat">
  <div id="chatHeader">Room Chat</div>
  <div id="messages"></div>
  <div id="typingIndicator"></div>
  <input id="username" placeholder="Your name">
  <input id="message" placeholder="Type a message">
  <button onclick="sendMessage()">Send</button>
  <button onclick="clearChat()">Clear Chat</button>
  <button id="darkModeBtn" onclick="toggleDarkMode()">Toggle Dark Mode</button>
</div>

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
  // Firebase setup
  const firebaseConfig = {
    apiKey: "AIzaSyCR_fzXg5elyqPiBFxjn7l98y7pHFtFrBI",
    authDomain: "chat-85bb8.firebaseapp.com",
    databaseURL: "https://chat-85bb8-default-rtdb.firebaseio.com",
    projectId: "chat-85bb8",
    storageBucket: "chat-85bb8.firebasestorage.app",
    messagingSenderId: "925323589808",
    appId: "1:925323589808:web:6b599f66cbbbe0f7e1e375"
  };
  firebase.initializeApp(firebaseConfig);

  let roomCode = "";
  let myUsername = "";
  let usernameLocked = false;
  let lastUser = "";

  let db;
  let typingRef;

  function joinRoom() {
    const code = document.getElementById("roomCodeInput").value.trim();
    if (!code) { alert("Enter a room code"); return; }
    roomCode = code;
    startChat();
  }

  function createRoom() {
    const code = document.getElementById("newRoomCode").value.trim();
    if (!code) { alert("Enter a new room code"); return; }
    roomCode = code;
    startChat();
  }

  function startChat() {
    db = firebase.database().ref("rooms/" + roomCode + "/messages");
    typingRef = firebase.database().ref("rooms/" + roomCode + "/typing");

    document.getElementById("roomSelection").style.display = "none";
    document.getElementById("chat").style.display = "flex";

    // Show room code in header
    document.getElementById("chatHeader").textContent = "Room: " + roomCode;

    db.on("child_added", function(snapshot) {
      const msg = snapshot.val();
      displayMessage(msg.user, msg.text, msg.timestamp);
    });

    db.on("value", function(snapshot){
      if (!snapshot.exists()){
        document.getElementById("messages").innerHTML = "";
        lastUser = "";
      }
    });

    typingRef.on("value", function(snapshot){
      const usersTyping = snapshot.val() || {};
      let others = Object.keys(usersTyping).filter(u => u !== myUsername);
      document.getElementById("typingIndicator").textContent = 
        others.length ? others.join(", ") + " is typing..." : "";
    });
  }

  function sendMessage() {
    const usernameInput = document.getElementById("username");
    const messageInput = document.getElementById("message");
    const user = usernameInput.value.trim();
    const text = messageInput.value.trim();
    if (!user || !text) return;

    if (!usernameLocked){
      myUsername = user;
      usernameInput.disabled = true;
      usernameLocked = true;
    }

    const timestamp = Date.now();
    db.push({ user, text, timestamp });
    messageInput.value = "";

    typingRef.child(myUsername).remove();
  }

  function displayMessage(user, text, timestamp) {
    const messagesDiv = document.getElementById("messages");
    const div = document.createElement("div");
    div.classList.add("message");
    div.classList.add(user === myUsername ? "me" : "other");

    const textDiv = document.createElement("div");
    textDiv.classList.add("text");
    textDiv.textContent = (user !== lastUser ? user + ": " : "") + text;
    lastUser = user;

    const timeDiv = document.createElement("div");
    timeDiv.classList.add("time");
    const date = new Date(timestamp || Date.now());
    let hours = date.getHours();
    const minutes = date.getMinutes().toString().padStart(2,'0');
    const ampm = hours >=12 ? 'PM':'AM';
    hours = hours % 12 || 12;
    timeDiv.textContent = `${hours}:${minutes} ${ampm}`;

    div.appendChild(textDiv);
    div.appendChild(timeDiv);
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  function clearChat(){
    if (!confirm("Clear chat for everyone?")) return;
    db.remove();
    document.getElementById("messages").innerHTML = "";
    lastUser = "";
  }

  document.getElementById("message").addEventListener("input", function() {
    if (!myUsername) return;
    typingRef.child(myUsername).set(true);
    setTimeout(()=> typingRef.child(myUsername).remove(), 2000);
  });

  document.getElementById("message").addEventListener("keydown", function(e){
    if (e.key === "Enter") sendMessage();
  });

  function toggleDarkMode(){
    document.body.classList.toggle("dark");
  }

</script>
</body>
</html>
