<!DOCTYPE html>
<html>
<head>
  <title>Mini Chat v3</title>
  <style>
    html, body { margin:0; padding:0; height:100%; font-family: Arial, sans-serif; display:flex; justify-content:center; align-items:center; transition: background 0.5s, color 0.5s; }
    body.dark { background:#1e1e1e; color:#eee; }

    #chatBox {
      width:400px; max-width:90%; height:600px; display:flex; flex-direction:column;
      border-radius:16px; overflow:hidden; box-shadow:0 4px 15px rgba(0,0,0,0.25);
      background: linear-gradient(135deg,#f8f8f8,#d9d5f6);
      transition: background 0.5s;
    }

    #chatHeader { text-align:center; font-weight:bold; padding:12px; border-bottom:1px solid #ccc; }
    #messages { flex:1; padding:12px; overflow-y:auto; display:flex; flex-direction:column; gap:12px; }

    .message { max-width:70%; padding:12px 16px; border-radius:20px; position:relative; font-size:16px; transition: background 0.5s; }
    .me { background:#7c3aed; color:white; align-self:flex-end; }
    .other { background:#d9d5f6; color:#111; align-self:flex-start; }

    .username { font-size:12px; font-weight:bold; margin-bottom:4px; opacity:0.9; }
    .reply-preview { font-size:12px; opacity:0.7; border-left:2px solid currentColor; padding-left:6px; margin-bottom:6px; }
    .reply-btn { position:absolute; top:-22px; right:6px; font-size:11px; background:rgba(0,0,0,0.25); color:white; padding:3px 6px; border-radius:6px; cursor:pointer; opacity:0; pointer-events:none; transition:opacity 0.4s ease; }
    .message:hover .reply-btn, .reply-btn:hover { opacity:1; pointer-events:auto; }

    .time { font-size:12px; opacity:0.7; margin-top:4px; text-align:right; }

    #replyingTo { font-size:14px; padding:8px; background:rgba(0,0,0,0.1); display:none; border-radius:12px; margin:4px 12px; }

    #bottomBar { display:flex; gap:6px; padding:10px; border-top:1px solid rgba(0,0,0,0.1); }
    #bottomBar input, #bottomBar button { flex:1; border-radius:12px; padding:8px; }
    #bottomBar button { flex:0 0 auto; background:#7c3aed; color:white; cursor:pointer; }

    #themeSelect, #roomNameBtn, #darkModeBtn { margin-top:6px; border-radius:8px; padding:6px; }
  </style>
</head>
<body>
  <div id="chatBox">
    <div id="chatHeader">Room</div>
    <div id="messages"></div>
    <div id="replyingTo"></div>
    <div id="bottomBar">
      <input id="username" placeholder="Your name">
      <input id="message" placeholder="Type a message">
      <button onclick="sendMessage()">Send</button>
    </div>
    <select id="themeSelect" onchange="applyThemeFromSelect()">
      <option value="default">Default</option>
      <option value="sunset">Sunset</option>
      <option value="ocean">Ocean</option>
      <option value="purple">Purple</option>
    </select>
    <button id="darkModeBtn" onclick="toggleDarkMode()">Dark Mode</button>
    <button id="roomNameBtn" onclick="setCustomRoomName(currentRoom)">Rename Chat</button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script>
    // ---------------- Firebase Init ----------------
    firebase.initializeApp({
      apiKey: "AIzaSyCR_fzXg5elyqPiBFxjn7l98y7pHFtFrBI",
      authDomain: "chat-85bb8.firebaseapp.com",
      databaseURL: "https://chat-85bb8-default-rtdb.firebaseio.com",
      projectId: "chat-85bb8",
      appId: "1:925323589808:web:6b599f66cbbbe0f7e1e375"
    });

    let currentRoom="", db, myUser="", replyData=null, unread=0;
    const baseTitle="Mini Chat";

    const themes={
      default:{bg:"linear-gradient(135deg,#f8f8f8,#d9d5f6)", me:"#7c3aed", other:"#d9d5f6"},
      sunset:{bg:"linear-gradient(135deg,#ffecd2,#feb47b)", me:"#ff7e5f", other:"#feb47b"},
      ocean:{bg:"linear-gradient(135deg,#a8edea,#0083b0)", me:"#00b4db", other:"#0083b0"},
      purple:{bg:"linear-gradient(135deg,#e0d4ff,#c9b7ff)", me:"#7c3aed", other:"#c9b7ff"}
    };

    // ---------------- Room functions ----------------
    function randomRoomCode(){ return Math.random().toString(36).substring(2,7).toUpperCase(); }
    function joinRoomWithCode(code){ currentRoom=code; startChat(); }
    function createRoom(){ joinRoomWithCode(randomRoomCode()); }

    function startChat(){
      document.getElementById("chatHeader").textContent=currentRoom;
      db=firebase.database().ref("rooms/"+currentRoom+"/messages");
      document.getElementById("messages").innerHTML="";
      loadTheme(currentRoom); applyRoomName(currentRoom);
      db.off();
      db.on("child_added",snap=>{
        if(!document.hasFocus()){ unread++; document.title=`${baseTitle} (${unread})`; }
        renderMessage(snap.val());
      });
    }
    window.addEventListener("focus",()=>{ unread=0; document.title=baseTitle; });

    // ---------------- Messages ----------------
    function sendMessage(){
      if(!myUser) myUser=document.getElementById("username").value.trim();
      const text=document.getElementById("message").value.trim();
      if(!text || !myUser) return;
      db.push({user:myUser,text,reply:replyData,timestamp:Date.now()});
      replyData=null; document.getElementById("replyingTo").style.display="none"; document.getElementById("message").value="";
    }

    function renderMessage(msg){
      const div=document.createElement("div");
      div.className="message "+(msg.user===myUser?"me":"other");

      const replyBtn=document.createElement("div");
      replyBtn.className="reply-btn"; replyBtn.textContent="Reply";
      replyBtn.onclick=()=>{ replyData={user:msg.user,text:msg.text}; 
        const r=document.getElementById("replyingTo"); 
        r.textContent=`Replying to ${msg.user}: ${msg.text}`; r.style.display="block";
      }

      if(msg.reply){ const rp=document.createElement("div"); rp.className="reply-preview"; rp.textContent=msg.reply.user+": "+msg.reply.text; div.appendChild(rp); }

      const userDiv=document.createElement("div"); userDiv.className="username"; userDiv.textContent=msg.user;
      const textDiv=document.createElement("div"); textDiv.textContent=msg.text;
      const timeDiv=document.createElement("div"); timeDiv.className="time";
      const d=new Date(msg.timestamp); let h=d.getHours(), m=d.getMinutes().toString().padStart(2,"0");
      timeDiv.textContent=`${h%12||12}:${m} ${h>=12?"PM":"AM"}`;

      div.append(replyBtn,userDiv,textDiv,timeDiv);
      document.getElementById("messages").appendChild(div);
      document.getElementById("messages").scrollTop=document.getElementById("messages").scrollHeight;
    }
    document.getElementById("message").addEventListener("keydown",e=>{ if(e.key==="Enter") sendMessage(); });

    // ---------------- Dark Mode ----------------
    function toggleDarkMode(){ document.body.classList.toggle("dark"); applyThemeFromSelect(); }

    // ---------------- Room Name ----------------
    function setCustomRoomName(room){ const name=prompt("Name this chat (only for you):"); if(!name) return; localStorage.setItem("roomName_"+room,name); applyRoomName(room); }
    function applyRoomName(room){ const n=localStorage.getItem("roomName_"+room); if(n) document.getElementById("chatHeader").textContent=n; }

    // ---------------- Themes ----------------
    function applyThemeFromSelect(){
      const sel=document.getElementById("themeSelect").value;
      if(!currentRoom) return;
      localStorage.setItem("roomTheme_"+currentRoom,sel);
      const theme=themes[sel];
      document.getElementById("chatBox").style.background=theme.bg;
      document.querySelectorAll(".message").forEach(div=>{ div.classList.contains("me")? div.style.background=theme.me : div.style.background=theme.other; });
    }
    function loadTheme(room){ const saved=localStorage.getItem("roomTheme_"+room)||"default"; document.getElementById("themeSelect").value=saved; applyThemeFromSelect(); }
  </script>
</body>
</html>
